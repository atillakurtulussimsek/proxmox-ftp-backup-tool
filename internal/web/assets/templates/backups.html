{{define "content"}}
<header class="page-head">
  <div><h1>Yedekler</h1><p class="sub">FTP sunucusundaki yedekler, VM'e göre gruplu</p></div>
  <div class="actions"><button class="btn" hx-get="/backups/list" hx-target="#backup-list">Yenile</button></div>
</header>
<div id="job-status" hx-get="/jobs/status" hx-trigger="load, every 2s, jobChanged from:body"></div>
<div id="backup-list" hx-get="/backups/list" hx-trigger="load, backupsChanged from:body">
  <p class="empty">FTP listesi alınıyor…</p>
</div>
{{end}}

{{define "layout"}}<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>{{.Title}} · PVE FTP Yedek</title>
<link rel="stylesheet" href="/static/style.css?v={{.Version}}">
<script src="/static/htmx.min.js?v={{.Version}}" defer></script>
<script src="/static/app.js?v={{.Version}}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}'>
<div class="shell">
  <aside class="side">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">PVE FTP Yedek<small>{{.Node}}</small></span>
    </a>
    <nav class="nav">
      <a href="/" {{if eq .Active "dashboard"}}class="on" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Kontrol Paneli</span></a>
      <a href="/backups" {{if eq .Active "backups"}}class="on" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v6c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-6"/><path d="M4 11.5v6c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-6"/></svg>
        <span>Yedekler</span></a>
      <a href="/history" {{if or (eq .Active "history") (eq .Active "job")}}class="on" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Geçmiş</span></a>
      <a href="/settings" {{if eq .Active "settings"}}class="on" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Ayarlar</span></a>
    </nav>
    <div class="side-foot mono">{{.Version}}</div>
  </aside>
  <main class="main">
{{template "content" .}}
  </main>
</div>
<div id="flash" class="toasts" aria-live="polite"></div>
</body>
</html>{{end}}
